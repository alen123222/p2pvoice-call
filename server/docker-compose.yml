services:
  # 1. P2P signaling server (handles handshake, call control and ICE exchange; no media)
  signaling:
    build: .
    container_name: p2p-signaling
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      # Optional shared token required by clients at registration.
      - SIGNALING_TOKEN=${SIGNALING_TOKEN:-}
      # Enable TURN credential issuance (TURN REST API). Set TURN_SECRET to the
      # same value as Coturn's static-auth-secret.
      - TURN_SERVER=${TURN_SERVER:-170.106.195.109:3478}
      - TURN_SECRET=${TURN_SECRET:-}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080', r => process.exit(r.statusCode === 426 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 2. STUN / private TURN relay (helps phones traverse NAT; media stays DTLS-SRTP encrypted)
  stun:
    image: coturn/coturn:latest
    container_name: p2p-stun
    restart: always
    network_mode: "host" # STUN/TURN requires host networking to see real client IPs
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
