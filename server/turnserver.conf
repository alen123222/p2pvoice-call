# Coturn Configuration - STUN + Private TURN Relay (REST API auth)
# Dual Mode: Prioritizes 100% Direct P2P (STUN).
# If carriers' Symmetric NAT completely blocks direct hole-punching,
# falls back to your private encrypted relay (DTLS-SRTP end-to-end encrypted).
#
# IMPORTANT: static-auth-secret below MUST equal the TURN_SECRET environment
# variable configured on the signaling server (see signaling.js). Credentials
# are issued per-call by the signaling server via the TURN REST API.

# Listening ports
listening-port=3478
tls-listening-port=5349

# Your VPS Public IP (Required for proper NAT relay allocation)
external-ip=170.106.195.109

# Authentication Realm (REST API long-term credentials)
realm=p2p.call
use-auth-secret
static-auth-secret=CHANGE_ME_TO_MATCH_SIGNALING_TURN_SECRET

# Compact UDP relay port range (easy to allow in VPS firewall if needed)
min-port=49152
max-port=49200

# STUN message fingerprint
fingerprint

# Verbose Logging
verbose
log-file=stdout
