# Coturn Configuration - High Performance STUN & Private TURN Relay
# Dual Mode: Prioritizes 100% Direct P2P (STUN).
# If carriers' Symmetric NAT completely blocks direct hole-punching,
# falls back to your private encrypted VPS relay (DTLS-SRTP end-to-end encrypted).

# Listening ports
listening-port=3478
tls-listening-port=5349

# Your VPS Public IP (Required for proper NAT relay allocation)
external-ip=170.106.195.109

# Authentication Realm & Long-term credentials
realm=p2p.call
user=p2puser:p2psecret2026
lt-cred-mech

# Compact UDP relay port range (easy to allow in VPS firewall if needed)
min-port=49152
max-port=49200

# STUN message fingerprint
fingerprint

# Verbose Logging
verbose
log-file=stdout
