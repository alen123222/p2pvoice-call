name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Dependencies
        run: |
          cd client
          flutter pub get

      - name: Install Pods
        run: |
          cd client/ios
          pod install --repo-update

      - name: Build iOS Application (No Code Sign)
        run: |
          cd client
          flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          cd client/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r P2P_Voice_Call_iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: P2P_Voice_Call_iOS
          path: client/build/ios/iphoneos/P2P_Voice_Call_iOS.ipa
