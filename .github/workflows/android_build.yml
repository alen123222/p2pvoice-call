name: Build Android APK (Slimmed)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd client
          flutter pub get

      - name: Build Android APK (Split Per ABI & Slimmed)
        run: |
          cd client
          mkdir -p build/symbols
          flutter build apk --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/symbols \
            --tree-shake-icons

      - name: Upload Arm64 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: P2P_Voice_Call_Android_arm64-v8a
          path: client/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload Armeabi-v7a APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: P2P_Voice_Call_Android_armeabi-v7a
          path: client/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Upload Debug Symbols Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android_Debug_Symbols
          path: client/build/symbols
